{% extends "base.html" %}

{% block content %}
<div class="card map-card">
  <h2 class="section-title"><span class="icon">📍</span>避難所マップ</h2>
  <div id="shelterMap"></div>
</div>

<div class="card weather-card">
  <div class="weather-header">
    <h2 class="weather-title"><span class="icon">☁️</span>青森市 気象警報・注意報</h2>
    <div class="badge">⟳ 10分おき自動更新</div>
  </div>

  <div id="weatherContent" class="weather-body">
    <div class="weather-location">📍 青森市</div>
    <div class="weather-datetime"><span class="dot">◉</span> 気象庁発表時刻：更新中...</div>
  </div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const map = L.map('shelterMap').setView([35.3390, 139.4903], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        referrerPolicy: 'strict-origin-when-cross-origin'
    }).addTo(map);

    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                console.log('気象情報を更新しました:', data);
                updateWeatherContent(data);
            })
            .catch(error => {
                console.error('気象情報の更新に失敗しました:', error);
            });
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');

        if (data.error) {
            weatherContent.innerHTML = `
                <div class="weather-location">📍 ${data.area_name || '青森市'}</div>
                <div class="weather-status">⚠️ 気象情報の取得に失敗しました</div>
            `;
            return;
        }

        let warningsHtml = '';
        if (data.warnings && data.warnings.length > 0) {
            warningsHtml = '<ul>';
            data.warnings.forEach(warning => {
                warningsHtml += `<li>${warning.name}（${warning.status}）</li>`;
            });
            warningsHtml += '</ul>';
        } else {
            warningsHtml = '<div class="weather-status">✓ 現在、警報・注意報は発表されていません</div>';
        }

        weatherContent.innerHTML = `
            <div class="weather-location">📍 ${data.area_name || '青森市'}</div>
            ${warningsHtml}
            <div class="weather-datetime"><span class="dot">◉</span> データ取得時刻：${data.last_fetch_time || '更新中...'}</div>
            <div class="weather-datetime"><span class="dot">◉</span> 気象庁発表時刻：${data.report_time || '不明'}</div>
        `;
    }

    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
